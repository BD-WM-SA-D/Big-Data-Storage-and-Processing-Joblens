[project]
name = "big-data-storage-and-processing-joblens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "dbt-core>=1.10,<2",
    "dbt-trino>=1.10.6",
    "great-expectations>=1.23,<1.24",
    "joblens-contracts",
    "pyspark>=4.1,<4.2",
]

[tool.uv.sources]
joblens-contracts = { git = "https://github.com/BD-WM-SA-D/joblens" }

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
