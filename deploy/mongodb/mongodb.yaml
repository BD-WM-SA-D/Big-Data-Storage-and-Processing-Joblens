# MongoDB 8.0 (một node, không replica set) – kho NoSQL phục vụ (serving) của nền tảng, namespace "serving".
# Yêu cầu môn học: "Cơ sở dữ liệu: NoSQL". Vai trò trong kiến trúc (docs/adr/0001-lambda-vs-kappa.md):
#   - province_windows        : kết quả job streaming có trạng thái (cửa sổ 5 phút × tỉnh, watermark) – upsert
#   - analytics_*             : kết quả job Spark phân tích (thống kê lương, pivot, chỉ số mô hình MLlib)
# Collection nội bộ của repo Big-Data (chưa repo nào khác đọc) nên chưa cần contract ở joblens/schemas
# (joblens/schemas/README.md: "Bảng nội bộ của một repo … không cần contract"). App muốn đọc thì thêm contract trước.
# Mật khẩu trong Secret "mongodb-auth" do install.sh sinh; WiredTiger cache 256 MB cho máy dev.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: serving
spec:
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: serving
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0.32
          args: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: root-password
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
