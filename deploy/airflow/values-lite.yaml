# Bổ sung cho values.yaml khi JOBLENS_PROFILE=lite (máy 8 GB) – install.sh tự thêm "-f values-lite.yaml".
# Task Spark của DAG chạy local mode (Variable joblens_spark_executors = 0, install.sh đặt).
scheduler:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
dagProcessor:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
apiServer:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 640Mi
config:
  dag_processor:
    parsing_processes: 1
