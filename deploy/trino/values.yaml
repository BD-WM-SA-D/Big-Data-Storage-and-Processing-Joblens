# Helm values cho Trino 483 – chart trinodb/trino 1.44.0. Namespace "serving".
# Một node: coordinator kiêm worker (nodeScheduler.includeCoordinator) – máy dev 16 GB RAM không đủ cho
# coordinator + worker riêng (~3,3 GB). Ngân sách ~1,8 GB. Lên cụm thật thì tăng server.workers.
# Catalog "iceberg" đọc warehouse "joblens" qua Lakekeeper (Iceberg REST), dữ liệu trên SeaweedFS (S3).
# Khóa S3 lấy từ Secret "joblens-s3" (install.sh tạo từ .env), không ghi vào file này.

image:
  tag: "483"

server:
  workers: 0
  config:
    query:
      maxMemory: "1GB"

coordinator:
  jvm:
    maxHeapSize: "1400M"
  config:
    nodeScheduler:
      includeCoordinator: true
    query:
      maxMemoryPerNode: "600MB"
  # limit = heap 1400M + ~0,9 GB ngoài heap (metaspace, luồng, bộ đệm trực tiếp). Với limit 1792Mi (sát heap) pod
  # khởi động lại giữa lần dbt build 2026-10-23 01:47 (dbt báo Trino "Connection refused"; seed + mart chạy song song).
  resources:
    requests:
      cpu: 250m
      memory: 1792Mi
    limits:
      memory: 2304Mi

worker:
  jvm:
    maxHeapSize: "1200M"
  config:
    query:
      maxMemoryPerNode: "512MB"
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 1792Mi

envFrom:
  - secretRef:
      name: joblens-s3

catalogs:
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://lakekeeper.lakehouse.svc.cluster.local:8181/catalog
    iceberg.rest-catalog.warehouse=joblens
    iceberg.rest-catalog.vended-credentials-enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-all-in-one.lakehouse.svc.cluster.local:8333
    s3.region=${ENV:JOBLENS_S3_REGION}
    s3.path-style-access=true
    s3.aws-access-key=${ENV:JOBLENS_S3_ACCESS_KEY_ID}
    s3.aws-secret-key=${ENV:JOBLENS_S3_SECRET_ACCESS_KEY}
  tpch: |
    connector.name=tpch
    tpch.splits-per-node=4
