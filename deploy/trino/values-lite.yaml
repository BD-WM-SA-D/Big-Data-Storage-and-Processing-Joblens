# Bổ sung cho values.yaml khi JOBLENS_PROFILE=lite (máy 8 GB) – install.sh tự thêm "-f values-lite.yaml".
# CẢNH BÁO: profile lite KHÔNG đủ cho `dbt build` trên ~48 nghìn tin – Trino coordinator bị OOMKilled
# (exit 137) dù đã chạy 1 luồng. Chạy dbt với JOBLENS_PROFILE=full (máy ≥16 GB) hoặc tăng limits lên
# ≥2304Mi như values.yaml. Lite chỉ dùng cho truy vấn/demo nhẹ.
server:
  config:
    query:
      maxMemory: "300MB"
coordinator:
  jvm:
    maxHeapSize: "768M"
  config:
    query:
      maxMemoryPerNode: "300MB"
  resources:  # chừa ~0,5 GB ngoài heap (xem values.yaml)
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 1280Mi
