# Grafana 13.2.4 + plugin Trino (trino-datasource 1.4.1) – dashboard "JobLens – Big Data demo" đọc thẳng các
# bảng Iceberg qua Trino (dashboards/joblens-demo.json, tự làm mới 5 giây).
# Mật khẩu admin nằm trong Secret "grafana-admin" do install.sh sinh; người xem không cần đăng nhập (Viewer).
# Plugin tải từ grafana.com lần đầu khởi động rồi lưu trên PVC → buổi demo không cần Internet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Trino
        uid: trino
        type: trino-datasource
        access: proxy
        url: http://trino.serving.svc.cluster.local:8080
        isDefault: true
        editable: false
        basicAuth: false
        jsonData:
          enableImpersonation: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: joblens
        folder: JobLens
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/joblens
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate   # PVC ReadWriteOnce
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports:
            - containerPort: 3000
          env:
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: trino-datasource@1.4.1
            - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/joblens/joblens-demo.json
            - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
              value: 5s
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          # 2026-10-23: với limit 384Mi + 50m CPU, Grafana 13 kẹt "0/1 Running" 20+ phút sau khi khởi động lại cụm
          # (log: "Failed to find organization … context canceled", readiness /api/health không qua) → nới tài nguyên.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/joblens
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
