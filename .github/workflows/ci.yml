name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cài dependency
        run: uv sync --frozen
      - name: Kiểm tra pre-commit
        run: uv run pre-commit run --all-files
      - name: Chạy pytest
        run: uv run pytest -q
      - name: Parse dbt
        run: uv run dbt parse --project-dir dbt
        env:
          DBT_PROFILES_DIR: dbt
